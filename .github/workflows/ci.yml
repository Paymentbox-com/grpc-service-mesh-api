name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the token is read-only. No job here writes to the repo.
permissions:
  contents: read

env:
  PROTOC_VERSION: "33.4"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install protoc
        run: |
          name="protoc-${PROTOC_VERSION}-linux-x86_64"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${name}.zip" -o protoc.zip
          sudo unzip -q -o protoc.zip -d /usr/local
          sudo chmod -R a+rX /usr/local/include/google
          protoc --version

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Compile and load the generated example
        run: GRPC_SERVICE_MESH_GEN_INTEGRATION=1 go test -race -count=1 ./internal/integration/...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
